# Tablo Auto-Renamer v1
# Core paths (absolute, with trailing slash)
paths:
  raw_dir:    /opt/tablo/raw/          # HLS downloads, auto-cleared
  clean_dir:  /opt/tablo/clean/        # Commercial-free MP4s, kept until identified
  plex_tv_root: /Users/Shared/Plex/TV/  # Final destination for identified files
  meta_dir:   /opt/tablo/meta/         # Per-recording JSON metadata
  epg_dir:    /opt/tablo/epg/          # TVMaze schedule cache
  logs_dir:   /opt/tablo/logs/         # Rotated logs, optional
  state_file: /opt/tablo/state.json    # Simple DB of known IDs / last EPG fetch

# Tablo device
tablo:
  ip: "192.168.7.123"  # Find via Bonjour mDNS or your router
  port: 18080          # Tablo HTTP API port
  mode: "network"      # "streaming" (older firmware), "direct_drive" (USB), or "network" (RPi4 + Mac mini)

# Direct drive mode (for 4th gen with locked firmware)
direct_drive:
  # Path where Tablo USB drive will be mounted
  mount_point: "/Volumes/Tablo"
  # Tablo drive structure (auto-detected if not specified)
  recordings_path: "recordings"  # Usually "recordings" inside the Tablo drive
  # Auto-detect new recordings when drive is connected
  auto_detect: true
  # Optional: move processed files to archive folder on Tablo drive
  archive_processed: false
  archive_path: "processed"

# Time handling
timezone: "America/New_York"  # For ISO output filenames

# External binaries
tools:
  ffmpeg:  ffmpeg
  ffprobe: ffprobe
  comskip: comskip
  whisper: whisper
  ollama:  ollama

# LLM for disambiguation (optional but recommended)
llm:
  model: llama3:8b
  url:   http://localhost:11434/api/chat
  max_attempts: 3

# EPG source
epg:
  country: "US"
  networks:
    - PBS
    - CBS
    - NBC
    - ABC
    - FOX
  days_back:    7
  days_forward: 14

# Matching tolerances (seconds)
match:
  start_window: 300     # ±5 min
  duration_window: 120  # ±2 min
  min_score: 0.75       # Minimum fuzzy match score